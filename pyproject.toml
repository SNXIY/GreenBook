[project]
name = "greenbook-agent-platform"
version = "2.0.0"
description = "GreenBook Agent Runtime monorepo"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = [
    "packages/agent_core",
    "packages/contracts",
    "packages/java_client",
    "packages/creator_client",
    "packages/security",
    "packages/observability",
    "packages/evaluation",
    "services/greenbook_mcp",
    "apps/agent_api",
    "apps/agent_worker",
]

[tool.uv.sources]
greenbook-agent-core = { workspace = true }
greenbook-contracts = { workspace = true }
greenbook-java-client = { workspace = true }
greenbook-creator-client = { workspace = true }
greenbook-security = { workspace = true }
greenbook-observability = { workspace = true }
greenbook-evaluation = { workspace = true }
greenbook-mcp-server = { workspace = true }
greenbook-agent-api = { workspace = true }
greenbook-agent-worker = { workspace = true }

[dependency-groups]
dev = [
    "greenbook-agent-api",
    "greenbook-agent-core",
    "greenbook-agent-worker",
    "greenbook-contracts",
    "greenbook-creator-client",
    "greenbook-evaluation",
    "greenbook-java-client",
    "greenbook-mcp-server",
    "greenbook-observability",
    "greenbook-security",
    "asyncpg>=0.31",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "requests>=2.32",
    "ruff>=0.11",
    "mypy>=1.13",
    "pyjwt>=2.9",
    "cryptography>=43",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastapi>=0.115",
    "openai>=1.58",
    "sse-starlette>=2.1",
    "tenacity>=9.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: tests that require live external GreenBook services",
    "integration: tests that exercise persisted or cross-module integration contracts",
]
pythonpath = [
    ".",
    "packages/agent_core",
    "packages/contracts",
    "packages/java_client",
    "packages/creator_client",
    "packages/security",
    "packages/observability",
    "packages/evaluation",
    "services/greenbook_mcp",
    "apps/agent_api",
    "apps/agent_worker",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
