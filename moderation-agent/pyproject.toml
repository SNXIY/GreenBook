[project]
name = "content-moderation-platform"
version = "0.1.0"
description = "Independent content moderation platform built with LangGraph and FastAPI"
readme = "README.md"
authors = [{ name = "Content Moderation Platform Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.12,<3.15"

dependencies = [
    "alembic>=1.18.5",
    "aiosqlite >=0.20",
    "fastapi ~=0.139.0",
    "httpx ~=0.28.1",
    "langchain-core ~=1.4.8",
    "langchain-anthropic ~=1.4.8",
    "langchain-aws ~=1.6.1",
    "langchain-google-genai ~=4.2.6",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq ~=1.1.3",
    "langchain-ollama ~=1.1.0",
    "langchain-openai ~=1.3.3",
    "langgraph ~=1.2.7",
    "langgraph-checkpoint-postgres ~=3.1.0",
    "langgraph-checkpoint-sqlite ~=3.1.0",
    "langsmith ~=0.10.2",
    "psycopg[binary,pool] ~=3.3.4",
    "pydantic ~=2.13.4",
    "pydantic-settings ~=2.14.2",
    "python-dotenv ~=1.2.2",
    "qdrant-client ~=1.18.0",
    "redis ~=8.0.1",
    "sqlalchemy ~=2.0.51",
    "uvicorn ~=0.51.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-asyncio",
    "ruff",
    "mypy ~=2.2.0",
    "pymarkdownlnt",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "U"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.pymarkdown]
# Docs use long, unwrapped prose lines rather than hard-wrapping at a fixed
# column, so line length isn't enforced.
plugins.md013.enabled = false
# Inline HTML (e.g. <img> with width=) is used intentionally in README.md.
plugins.md033.enabled = false
# Not every doc needs to start with a top-level heading.
plugins.md041.enabled = false
# Allow repeated heading text as long as it's not adjacent siblings.
plugins.md024.siblings_only = true

[tool.mypy]
plugins = "pydantic.mypy"
