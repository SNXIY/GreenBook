[project]
name = "greenbook-agent-api"
version = "0.1.0"
description = "GreenBook Agent API — FastAPI with MCP-backed agent"
requires-python = ">=3.12"
dependencies = [
    "greenbook-contracts",
    "greenbook-security",
    "greenbook-agent-core",
    "greenbook-mcp-server",
    "greenbook-java-client",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "openai>=1.80",
]

[tool.hatch.build.targets.wheel]
packages = ["greenbook_agent_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
