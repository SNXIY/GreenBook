<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#173f2d">
  <title>GREEN-BOOK AI 创作登录</title>
  <link rel="icon" href="/favicon.svg?v=greenbook-forest-20260729">
  <link rel="stylesheet" href="/login.css?v=greenbook-forest-20260729">
</head>
<body>
  <header class="login-topbar">
    <a class="brand" href="/" aria-label="GREEN-BOOK AI 创作">
      <img src="/favicon.svg" width="40" height="40" alt="">
      <span>
        <small>KNOWLEDGE GROWS HERE</small>
        <strong translate="no">GREEN-BOOK AI 创作</strong>
      </span>
    </a>
    <span id="serviceState" class="service-state is-loading">连接中</span>
  </header>

  <main class="login-shell">
    <section class="login-panel" aria-labelledby="loginTitle">
      <p class="eyebrow">GREEN-BOOK CREATOR</p>
      <h1 id="loginTitle">进入创作工作台</h1>
      <form id="loginForm">
        <label>
          <span>用户名</span>
          <input id="username" autocomplete="username" required>
        </label>
        <label>
          <span>密码</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">登录</button>
        <p id="loginState" class="form-state" aria-live="polite">请输入部署时配置的本地开发账号</p>
      </form>
    </section>
  </main>

  <script src="/app.js?v=creator-local-auto-login-20260727"></script>
</body>
</html>
