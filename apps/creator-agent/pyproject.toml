[project]
name = "greenbook-creator-agent"
version = "0.1.0"
description = "GreenBook long-running content creation agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.18.5",
    "cryptography>=42.0.0",
    "PyJWT[crypto]==2.13.0",
    "redis==5.2.1",
    "pydantic>=2.11,<3",
    "pydantic-settings==2.7.1",
    "aiosqlite==0.20.0",
    "psycopg[binary,pool]==3.2.4",
    "httpx==0.28.1",
    "mcp>=1.28.1,<2",
    "sse-starlette==3.0.3",
    "langgraph~=1.2.7",
    "langgraph-checkpoint-sqlite~=3.1.0",
    "langgraph-checkpoint-postgres~=3.1.0",
    "qdrant-client~=1.18.0",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
]

[dependency-groups]
dev = [
    "black==24.4.2",
    "mypy==1.10.0",
    "pytest==8.3.5",
    "ruff==0.15.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
