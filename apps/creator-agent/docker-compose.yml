x-mindflow-service: &mindflow-service
  build:
    context: .
    target: runtime
  image: mindflow-creator:${MINDFLOW_IMAGE_TAG:-local}
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777

x-creator-database-env: &creator-database-env
  CREATOR_DATABASE_URL: postgresql+psycopg://${CREATOR_POSTGRES_USER:-mindflow}:${CREATOR_POSTGRES_PASSWORD:?Set CREATOR_POSTGRES_PASSWORD}@creator-postgres:5432/${CREATOR_POSTGRES_DB:-mindflow_creator}

x-creator-runtime-env: &creator-runtime-env
  <<: *creator-database-env
  AI_PROVIDER: ${AI_PROVIDER:-deepseek}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  REDIS_URL: redis://:${CREATOR_REDIS_PASSWORD:?Set CREATOR_REDIS_PASSWORD}@redis:6379/0
  CREATOR_CHECKPOINT_BACKEND: postgres
  CREATOR_CHECKPOINT_POSTGRES_URL: postgresql://${CREATOR_POSTGRES_USER:-mindflow}:${CREATOR_POSTGRES_PASSWORD:?Set CREATOR_POSTGRES_PASSWORD}@creator-postgres:5432/${CREATOR_POSTGRES_DB:-mindflow_creator}
  CREATOR_MEMORY_ENABLED: ${CREATOR_MEMORY_ENABLED:-true}
  CREATOR_SHORT_MEMORY_ENABLED: ${CREATOR_SHORT_MEMORY_ENABLED:-true}
  CREATOR_LONG_MEMORY_ENABLED: ${CREATOR_LONG_MEMORY_ENABLED:-true}
  CREATOR_SEMANTIC_MEMORY_ENABLED: ${CREATOR_SEMANTIC_MEMORY_ENABLED:-true}
  CREATOR_MEMORY_QDRANT_URL: http://qdrant:6333
  CREATOR_MEMORY_QDRANT_COLLECTION: ${CREATOR_MEMORY_QDRANT_COLLECTION:-mindflow_creator_memory}
  CREATOR_MEMORY_EMBEDDING_PROVIDER: ${CREATOR_MEMORY_EMBEDDING_PROVIDER:-hashing}
  CREATOR_MEMORY_EMBEDDING_DIMENSIONS: ${CREATOR_MEMORY_EMBEDDING_DIMENSIONS:-256}
  CREATOR_RETRIEVAL_ENABLED: ${CREATOR_RETRIEVAL_ENABLED:-true}
  CREATOR_RETRIEVAL_SQL_ENABLED: ${CREATOR_RETRIEVAL_SQL_ENABLED:-true}
  CREATOR_RETRIEVAL_QDRANT_ENABLED: ${CREATOR_RETRIEVAL_QDRANT_ENABLED:-true}
  CREATOR_RETRIEVAL_QDRANT_URL: http://qdrant:6333
  CREATOR_RETRIEVAL_QDRANT_COLLECTION: ${CREATOR_RETRIEVAL_QDRANT_COLLECTION:-mindflow_creator_research}
  CREATOR_RETRIEVAL_RERANKER_PROVIDER: ${CREATOR_RETRIEVAL_RERANKER_PROVIDER:-heuristic}
  CREATOR_COMMUNITY_PROVIDER: ${CREATOR_COMMUNITY_PROVIDER:-java}
  CREATOR_COMMUNITY_JAVA_BASE_URL: ${CREATOR_COMMUNITY_JAVA_BASE_URL:-http://host.docker.internal:8080}
  CREATOR_COMMUNITY_JAVA_SHARED_SECRET: ${CREATOR_COMMUNITY_SHARED_SECRET:?Set CREATOR_COMMUNITY_SHARED_SECRET}
  CREATOR_COMMUNITY_JAVA_TENANT_ID: ${CREATOR_COMMUNITY_JAVA_TENANT_ID:-zhiguang}

services:
  creator-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CREATOR_POSTGRES_DB:-mindflow_creator}
      POSTGRES_USER: ${CREATOR_POSTGRES_USER:-mindflow}
      POSTGRES_PASSWORD: ${CREATOR_POSTGRES_PASSWORD:?Set CREATOR_POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - creator-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    cpus: "0.75"
    mem_limit: 1g

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${CREATOR_REDIS_PASSWORD:?Set CREATOR_REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${CREATOR_REDIS_PASSWORD:?Set CREATOR_REDIS_PASSWORD}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    cpus: "0.25"
    mem_limit: 256m

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    cpus: "0.75"
    mem_limit: 1g

  creator-migrate:
    <<: *mindflow-service
    command: ["python", "-m", "app.creator.deployment.migrate"]
    depends_on:
      creator-postgres:
        condition: service_healthy
    environment:
      <<: *creator-database-env
      CREATOR_CHECKPOINT_BACKEND: postgres
      CREATOR_CHECKPOINT_POSTGRES_URL: postgresql://${CREATOR_POSTGRES_USER:-mindflow}:${CREATOR_POSTGRES_PASSWORD:?Set CREATOR_POSTGRES_PASSWORD}@creator-postgres:5432/${CREATOR_POSTGRES_DB:-mindflow_creator}
      CREATOR_CHECKPOINT_AUTO_SETUP: "true"
    healthcheck:
      disable: true
    restart: "no"
    cpus: "0.25"
    mem_limit: 256m

  app:
    <<: *mindflow-service
    restart: unless-stopped
    depends_on:
      creator-migrate:
        condition: service_completed_successfully
    environment:
      <<: *creator-database-env
      CREATOR_API_EXECUTION_MODE: outbox
      CREATOR_API_CREATE_SCHEMA: "false"
      CREATOR_API_TENANT_ID: ${CREATOR_API_TENANT_ID:-zhiguang}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      CREATOR_COMMUNITY_PROVIDER: ${CREATOR_COMMUNITY_PROVIDER:-java}
      CREATOR_IDENTITY_MODE: ${CREATOR_IDENTITY_MODE:-trusted_proxy}
      CREATOR_BASIC_USERNAME: ${CREATOR_BASIC_USERNAME:-creator}
      CREATOR_BASIC_PASSWORD: ${CREATOR_BASIC_PASSWORD:-}
      CREATOR_BASIC_CREATOR_ID: ${CREATOR_BASIC_CREATOR_ID:-creator-local}
      CREATOR_BASIC_ACTOR_ID: ${CREATOR_BASIC_ACTOR_ID:-creator-local}
      CREATOR_BASIC_DISPLAY_NAME: ${CREATOR_BASIC_DISPLAY_NAME:-Demo Creator}
      CREATOR_BASIC_ROLES: ${CREATOR_BASIC_ROLES:-CREATOR}
      CREATOR_IDENTITY_ISSUER: ${CREATOR_IDENTITY_ISSUER:-}
      CREATOR_IDENTITY_AUDIENCE: ${CREATOR_IDENTITY_AUDIENCE:-}
      CREATOR_IDENTITY_JWKS_URL: ${CREATOR_IDENTITY_JWKS_URL:-}
      CREATOR_IDENTITY_ALGORITHMS: ${CREATOR_IDENTITY_ALGORITHMS:-RS256}
      CREATOR_IDENTITY_TENANT_CLAIM: ${CREATOR_IDENTITY_TENANT_CLAIM:-tenant_id}
      CREATOR_IDENTITY_CREATOR_CLAIM: ${CREATOR_IDENTITY_CREATOR_CLAIM:-creator_id}
      CREATOR_IDENTITY_ROLES_CLAIM: ${CREATOR_IDENTITY_ROLES_CLAIM:-roles}
      CREATOR_IDENTITY_DISPLAY_NAME_CLAIM: ${CREATOR_IDENTITY_DISPLAY_NAME_CLAIM:-name}
      CREATOR_IDENTITY_REQUIRED_ROLE: ${CREATOR_IDENTITY_REQUIRED_ROLE:-CREATOR}
      CREATOR_IDENTITY_LEEWAY_SECONDS: ${CREATOR_IDENTITY_LEEWAY_SECONDS:-30}
      CREATOR_IDENTITY_JWKS_CACHE_SECONDS: ${CREATOR_IDENTITY_JWKS_CACHE_SECONDS:-300}
      CREATOR_IDENTITY_JWKS_TIMEOUT_SECONDS: ${CREATOR_IDENTITY_JWKS_TIMEOUT_SECONDS:-5}
      CREATOR_IDENTITY_ALLOW_INSECURE_HTTP: ${CREATOR_IDENTITY_ALLOW_INSECURE_HTTP:-false}
      CREATOR_TRUSTED_PROXY_SHARED_SECRET: ${CREATOR_AGENT_SHARED_SECRET:?Set CREATOR_AGENT_SHARED_SECRET}
      CREATOR_TRUSTED_PROXY_ALLOWED_SERVICE: ${CREATOR_TRUSTED_PROXY_ALLOWED_SERVICE:-zhiguang-java-backend}
      CREATOR_TRUSTED_PROXY_TENANT_ID: ${CREATOR_TRUSTED_PROXY_TENANT_ID:-zhiguang}
      CREATOR_TRUSTED_PROXY_REQUIRED_ROLE: ${CREATOR_TRUSTED_PROXY_REQUIRED_ROLE:-CREATOR}
      CREATOR_TRUSTED_PROXY_ALLOWED_SKEW_SECONDS: ${CREATOR_TRUSTED_PROXY_ALLOWED_SKEW_SECONDS:-60}
      CREATOR_TRUSTED_PROXY_NONCE_TTL_SECONDS: ${CREATOR_TRUSTED_PROXY_NONCE_TTL_SECONDS:-120}
    ports:
      - "${CREATOR_API_PORT:-8092}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/actuator/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    stop_grace_period: 30s
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256

  creator-worker:
    <<: *mindflow-service
    command: ["python", "-m", "app.creator.worker.cli", "run"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      creator-migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    environment:
      <<: *creator-runtime-env
      CREATOR_WORKER_ID: ${CREATOR_WORKER_ID:-creator-runtime}
      CREATOR_WORKER_CONCURRENCY: ${CREATOR_WORKER_CONCURRENCY:-4}
      CREATOR_WORKER_BATCH_SIZE: ${CREATOR_WORKER_BATCH_SIZE:-8}
      CREATOR_WORKER_POLL_SECONDS: ${CREATOR_WORKER_POLL_SECONDS:-0.5}
      CREATOR_WORKER_OUTBOX_LEASE_SECONDS: ${CREATOR_WORKER_OUTBOX_LEASE_SECONDS:-300}
      CREATOR_WORKER_HEARTBEAT_SECONDS: ${CREATOR_WORKER_HEARTBEAT_SECONDS:-30}
      CREATOR_WORKER_MAX_ATTEMPTS: ${CREATOR_WORKER_MAX_ATTEMPTS:-8}
      CREATOR_WORKER_RETRY_BASE_SECONDS: ${CREATOR_WORKER_RETRY_BASE_SECONDS:-2}
      CREATOR_WORKER_RETRY_MAX_SECONDS: ${CREATOR_WORKER_RETRY_MAX_SECONDS:-60}
      CREATOR_WORKER_SHUTDOWN_GRACE_SECONDS: ${CREATOR_WORKER_SHUTDOWN_GRACE_SECONDS:-30}
      CREATOR_WORKER_HEALTH_FILE: /tmp/creator-worker-heartbeat
      CREATOR_WORKER_HEALTH_MAX_AGE_SECONDS: ${CREATOR_WORKER_HEALTH_MAX_AGE_SECONDS:-90}
      CREATOR_WORKER_CREATE_SCHEMA: "false"
      CREATOR_CHECKPOINT_AUTO_SETUP: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.creator.worker.cli",
          "healthcheck",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 45s
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256

  creator-mcp:
    <<: *mindflow-service
    profiles: ["creator-mcp"]
    command: ["python", "-m", "app.mcp_tools.creator_server"]
    restart: unless-stopped
    depends_on:
      creator-migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    environment:
      <<: *creator-database-env
      CREATOR_RETRIEVAL_ENABLED: ${CREATOR_RETRIEVAL_ENABLED:-true}
      CREATOR_RETRIEVAL_SQL_ENABLED: ${CREATOR_RETRIEVAL_SQL_ENABLED:-true}
      CREATOR_RETRIEVAL_QDRANT_ENABLED: ${CREATOR_RETRIEVAL_QDRANT_ENABLED:-true}
      CREATOR_RETRIEVAL_QDRANT_URL: http://qdrant:6333
      CREATOR_MEMORY_EMBEDDING_PROVIDER: ${CREATOR_MEMORY_EMBEDDING_PROVIDER:-hashing}
      CREATOR_COMMUNITY_PROVIDER: java
      CREATOR_MCP_TRANSPORT: streamable-http
      CREATOR_MCP_HOST: 0.0.0.0
      CREATOR_MCP_PORT: 8010
      CREATOR_MCP_TENANT_ID: ${CREATOR_MCP_TENANT_ID:-tenant-local}
      CREATOR_MCP_CREATOR_ID: ${CREATOR_MCP_CREATOR_ID:-creator-local}
      CREATOR_MCP_ACTOR_ID: ${CREATOR_MCP_ACTOR_ID:-mindflow-mcp}
      CREATOR_MCP_ROLES: ${CREATOR_MCP_ROLES:-CREATOR}
      CREATOR_MCP_ALLOWED_TOOLS: ${CREATOR_MCP_ALLOWED_TOOLS:-}
      CREATOR_MCP_BEARER_TOKEN: ${CREATOR_MCP_BEARER_TOKEN:-}
      CREATOR_MCP_AUTH_ISSUER_URL: ${CREATOR_MCP_AUTH_ISSUER_URL:-http://127.0.0.1:18010}
      CREATOR_MCP_RESOURCE_SERVER_URL: ${CREATOR_MCP_RESOURCE_SERVER_URL:-http://127.0.0.1:18010}
      CREATOR_MCP_ALLOWED_HOSTS: ${CREATOR_MCP_ALLOWED_HOSTS:-127.0.0.1,127.0.0.1:*,localhost,localhost:*,creator-mcp,creator-mcp:*}
      CREATOR_MCP_ALLOWED_ORIGINS: ${CREATOR_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "18010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; connection = socket.create_connection(('127.0.0.1', 8010), 2); connection.close()",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6
    cpus: "0.5"
    mem_limit: 512m

  creator-eval:
    <<: *mindflow-service
    profiles: ["creator-eval"]
    command:
      [
        "python",
        "-m",
        "app.creator.evaluation.cli",
        "--persist",
        "--fail-on-threshold",
      ]
    depends_on:
      creator-migrate:
        condition: service_completed_successfully
    environment:
      <<: *creator-database-env
      CREATOR_EVALUATION_DATASET_PATH: app/creator/evaluation/datasets/smoke-v1.json
      CREATOR_EVALUATION_OBSERVATIONS_PATH: app/creator/evaluation/datasets/smoke-observations-v1.json
      CREATOR_EVALUATION_OUTPUT_PATH: target/creator-evaluation-report.json
      CREATOR_EVALUATION_CANDIDATE_NAME: ${CREATOR_EVALUATION_CANDIDATE_NAME:-mindflow-creator}
      CREATOR_EVALUATION_CANDIDATE_VERSION: ${CREATOR_EVALUATION_CANDIDATE_VERSION:-development}
      CREATOR_EVALUATION_JUDGE_PROVIDER: ${CREATOR_EVALUATION_JUDGE_PROVIDER:-deterministic}
      CREATOR_EVALUATION_JUDGE_BASE_URL: ${CREATOR_EVALUATION_JUDGE_BASE_URL:-}
      CREATOR_EVALUATION_JUDGE_API_KEY: ${CREATOR_EVALUATION_JUDGE_API_KEY:-}
      CREATOR_EVALUATION_JUDGE_MODEL: ${CREATOR_EVALUATION_JUDGE_MODEL:-}
    volumes:
      - ./target:/app/target
    healthcheck:
      disable: true
    restart: "no"
    cpus: "1.0"
    mem_limit: 1g

volumes:
  creator-postgres-data:
  redis-data:
  qdrant-data:
