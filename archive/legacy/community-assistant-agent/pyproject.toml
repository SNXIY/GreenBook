[project]
name = "greenbook-community-assistant-agent"
version = "0.1.0"
description = "GreenBook community assistant orchestration agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "SQLAlchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "PyJWT[crypto]==2.10.1",
    "alembic==1.16.4",
    "redis==5.2.1",
    "langgraph==1.2.9",
    "mcp>=1.28,<2",
    "jsonschema>=4.23,<5",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "aiosqlite==0.21.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "regression: Canonical Phase 5 regression suite",
    "external: Requires external services",
]
