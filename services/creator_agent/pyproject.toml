[project]
name = "greenbook-creator-agent"
version = "0.1.0"
description = "GreenBook Creator Agent — professional content creation service with LangGraph"
requires-python = ">=3.12"
dependencies = [
    "greenbook-contracts",
    "greenbook-java-client",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "openai>=1.80",
    "fastapi>=0.115",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["greenbook_creator_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
