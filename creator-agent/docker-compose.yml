x-mindflow-service: &mindflow-service
  build:
    context: .
    target: runtime
  image: mindflow-creator:${MINDFLOW_IMAGE_TAG:-local}
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777

x-creator-database-env: &creator-database-env
  GREENBOOK_CREATOR_DATABASE_URL: postgresql+psycopg://${GREENBOOK_CREATOR_POSTGRES_USER:-mindflow}:${GREENBOOK_CREATOR_POSTGRES_PASSWORD:?Set GREENBOOK_CREATOR_POSTGRES_PASSWORD}@creator-postgres:5432/${GREENBOOK_CREATOR_POSTGRES_DB:-mindflow_creator}

x-creator-runtime-env: &creator-runtime-env
  <<: *creator-database-env
  AI_PROVIDER: ${AI_PROVIDER:-deepseek}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  REDIS_URL: redis://:${GREENBOOK_CREATOR_REDIS_PASSWORD:?Set GREENBOOK_CREATOR_REDIS_PASSWORD}@redis:6379/0
  GREENBOOK_CREATOR_CHECKPOINT_BACKEND: postgres
  GREENBOOK_CREATOR_CHECKPOINT_POSTGRES_URL: postgresql://${GREENBOOK_CREATOR_POSTGRES_USER:-mindflow}:${GREENBOOK_CREATOR_POSTGRES_PASSWORD:?Set GREENBOOK_CREATOR_POSTGRES_PASSWORD}@creator-postgres:5432/${GREENBOOK_CREATOR_POSTGRES_DB:-mindflow_creator}
  GREENBOOK_CREATOR_MEMORY_ENABLED: ${GREENBOOK_CREATOR_MEMORY_ENABLED:-true}
  GREENBOOK_CREATOR_SHORT_MEMORY_ENABLED: ${GREENBOOK_CREATOR_SHORT_MEMORY_ENABLED:-true}
  GREENBOOK_CREATOR_LONG_MEMORY_ENABLED: ${GREENBOOK_CREATOR_LONG_MEMORY_ENABLED:-true}
  GREENBOOK_CREATOR_SEMANTIC_MEMORY_ENABLED: ${GREENBOOK_CREATOR_SEMANTIC_MEMORY_ENABLED:-true}
  GREENBOOK_CREATOR_MEMORY_QDRANT_URL: http://qdrant:6333
  GREENBOOK_CREATOR_MEMORY_QDRANT_COLLECTION: ${GREENBOOK_CREATOR_MEMORY_QDRANT_COLLECTION:-mindflow_creator_memory}
  GREENBOOK_CREATOR_MEMORY_EMBEDDING_PROVIDER: ${GREENBOOK_CREATOR_MEMORY_EMBEDDING_PROVIDER:-hashing}
  GREENBOOK_CREATOR_MEMORY_EMBEDDING_DIMENSIONS: ${GREENBOOK_CREATOR_MEMORY_EMBEDDING_DIMENSIONS:-256}
  GREENBOOK_CREATOR_RETRIEVAL_ENABLED: ${GREENBOOK_CREATOR_RETRIEVAL_ENABLED:-true}
  GREENBOOK_CREATOR_RETRIEVAL_SQL_ENABLED: ${GREENBOOK_CREATOR_RETRIEVAL_SQL_ENABLED:-true}
  GREENBOOK_CREATOR_RETRIEVAL_QDRANT_ENABLED: ${GREENBOOK_CREATOR_RETRIEVAL_QDRANT_ENABLED:-true}
  GREENBOOK_CREATOR_RETRIEVAL_QDRANT_URL: http://qdrant:6333
  GREENBOOK_CREATOR_RETRIEVAL_QDRANT_COLLECTION: ${GREENBOOK_CREATOR_RETRIEVAL_QDRANT_COLLECTION:-mindflow_creator_research}
  GREENBOOK_CREATOR_RETRIEVAL_RERANKER_PROVIDER: ${GREENBOOK_CREATOR_RETRIEVAL_RERANKER_PROVIDER:-heuristic}
  GREENBOOK_CREATOR_COMMUNITY_PROVIDER: ${GREENBOOK_CREATOR_COMMUNITY_PROVIDER:-java}
  GREENBOOK_CREATOR_COMMUNITY_JAVA_BASE_URL: ${GREENBOOK_CREATOR_COMMUNITY_JAVA_BASE_URL:-http://host.docker.internal:8080}
  GREENBOOK_CREATOR_COMMUNITY_JAVA_SHARED_SECRET: ${GREENBOOK_CREATOR_COMMUNITY_SHARED_SECRET:?Set GREENBOOK_CREATOR_COMMUNITY_SHARED_SECRET}
  GREENBOOK_CREATOR_COMMUNITY_JAVA_TENANT_ID: ${GREENBOOK_CREATOR_COMMUNITY_JAVA_TENANT_ID:-zhiguang}

services:
  creator-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GREENBOOK_CREATOR_POSTGRES_DB:-mindflow_creator}
      POSTGRES_USER: ${GREENBOOK_CREATOR_POSTGRES_USER:-mindflow}
      POSTGRES_PASSWORD: ${GREENBOOK_CREATOR_POSTGRES_PASSWORD:?Set GREENBOOK_CREATOR_POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - creator-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    cpus: "0.75"
    mem_limit: 1g

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${GREENBOOK_CREATOR_REDIS_PASSWORD:?Set GREENBOOK_CREATOR_REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${GREENBOOK_CREATOR_REDIS_PASSWORD:?Set GREENBOOK_CREATOR_REDIS_PASSWORD}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    cpus: "0.25"
    mem_limit: 256m

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    cpus: "0.75"
    mem_limit: 1g

  creator-migrate:
    <<: *mindflow-service
    command: ["python", "-m", "app.creator.deployment.migrate"]
    depends_on:
      creator-postgres:
        condition: service_healthy
    environment:
      <<: *creator-database-env
      GREENBOOK_CREATOR_CHECKPOINT_BACKEND: postgres
      GREENBOOK_CREATOR_CHECKPOINT_POSTGRES_URL: postgresql://${GREENBOOK_CREATOR_POSTGRES_USER:-mindflow}:${GREENBOOK_CREATOR_POSTGRES_PASSWORD:?Set GREENBOOK_CREATOR_POSTGRES_PASSWORD}@creator-postgres:5432/${GREENBOOK_CREATOR_POSTGRES_DB:-mindflow_creator}
      GREENBOOK_CREATOR_CHECKPOINT_AUTO_SETUP: "true"
    healthcheck:
      disable: true
    restart: "no"
    cpus: "0.25"
    mem_limit: 256m

  app:
    <<: *mindflow-service
    restart: unless-stopped
    depends_on:
      creator-migrate:
        condition: service_completed_successfully
    environment:
      <<: *creator-database-env
      GREENBOOK_CREATOR_API_EXECUTION_MODE: outbox
      GREENBOOK_CREATOR_API_CREATE_SCHEMA: "false"
      GREENBOOK_CREATOR_API_TENANT_ID: ${GREENBOOK_CREATOR_API_TENANT_ID:-zhiguang}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      GREENBOOK_CREATOR_COMMUNITY_PROVIDER: ${GREENBOOK_CREATOR_COMMUNITY_PROVIDER:-java}
      GREENBOOK_CREATOR_IDENTITY_MODE: ${GREENBOOK_CREATOR_IDENTITY_MODE:-trusted_proxy}
      GREENBOOK_CREATOR_BASIC_USERNAME: ${GREENBOOK_CREATOR_BASIC_USERNAME:-creator}
      GREENBOOK_CREATOR_BASIC_PASSWORD: ${GREENBOOK_CREATOR_BASIC_PASSWORD:-}
      GREENBOOK_CREATOR_BASIC_CREATOR_ID: ${GREENBOOK_CREATOR_BASIC_CREATOR_ID:-creator-local}
      GREENBOOK_CREATOR_BASIC_ACTOR_ID: ${GREENBOOK_CREATOR_BASIC_ACTOR_ID:-creator-local}
      GREENBOOK_CREATOR_BASIC_DISPLAY_NAME: ${GREENBOOK_CREATOR_BASIC_DISPLAY_NAME:-Demo Creator}
      GREENBOOK_CREATOR_BASIC_ROLES: ${GREENBOOK_CREATOR_BASIC_ROLES:-CREATOR}
      GREENBOOK_CREATOR_IDENTITY_ISSUER: ${GREENBOOK_CREATOR_IDENTITY_ISSUER:-}
      GREENBOOK_CREATOR_IDENTITY_AUDIENCE: ${GREENBOOK_CREATOR_IDENTITY_AUDIENCE:-}
      GREENBOOK_CREATOR_IDENTITY_JWKS_URL: ${GREENBOOK_CREATOR_IDENTITY_JWKS_URL:-}
      GREENBOOK_CREATOR_IDENTITY_ALGORITHMS: ${GREENBOOK_CREATOR_IDENTITY_ALGORITHMS:-RS256}
      GREENBOOK_CREATOR_IDENTITY_TENANT_CLAIM: ${GREENBOOK_CREATOR_IDENTITY_TENANT_CLAIM:-tenant_id}
      GREENBOOK_CREATOR_IDENTITY_CREATOR_CLAIM: ${GREENBOOK_CREATOR_IDENTITY_CREATOR_CLAIM:-creator_id}
      GREENBOOK_CREATOR_IDENTITY_ROLES_CLAIM: ${GREENBOOK_CREATOR_IDENTITY_ROLES_CLAIM:-roles}
      GREENBOOK_CREATOR_IDENTITY_DISPLAY_NAME_CLAIM: ${GREENBOOK_CREATOR_IDENTITY_DISPLAY_NAME_CLAIM:-name}
      GREENBOOK_CREATOR_IDENTITY_REQUIRED_ROLE: ${GREENBOOK_CREATOR_IDENTITY_REQUIRED_ROLE:-CREATOR}
      GREENBOOK_CREATOR_IDENTITY_LEEWAY_SECONDS: ${GREENBOOK_CREATOR_IDENTITY_LEEWAY_SECONDS:-30}
      GREENBOOK_CREATOR_IDENTITY_JWKS_CACHE_SECONDS: ${GREENBOOK_CREATOR_IDENTITY_JWKS_CACHE_SECONDS:-300}
      GREENBOOK_CREATOR_IDENTITY_JWKS_TIMEOUT_SECONDS: ${GREENBOOK_CREATOR_IDENTITY_JWKS_TIMEOUT_SECONDS:-5}
      GREENBOOK_CREATOR_IDENTITY_ALLOW_INSECURE_HTTP: ${GREENBOOK_CREATOR_IDENTITY_ALLOW_INSECURE_HTTP:-false}
      GREENBOOK_CREATOR_TRUSTED_PROXY_SHARED_SECRET: ${GREENBOOK_CREATOR_AGENT_SHARED_SECRET:?Set GREENBOOK_CREATOR_AGENT_SHARED_SECRET}
      GREENBOOK_CREATOR_TRUSTED_PROXY_ALLOWED_SERVICE: ${GREENBOOK_CREATOR_TRUSTED_PROXY_ALLOWED_SERVICE:-zhiguang-java-backend}
      GREENBOOK_CREATOR_TRUSTED_PROXY_TENANT_ID: ${GREENBOOK_CREATOR_TRUSTED_PROXY_TENANT_ID:-zhiguang}
      GREENBOOK_CREATOR_TRUSTED_PROXY_REQUIRED_ROLE: ${GREENBOOK_CREATOR_TRUSTED_PROXY_REQUIRED_ROLE:-CREATOR}
      GREENBOOK_CREATOR_TRUSTED_PROXY_ALLOWED_SKEW_SECONDS: ${GREENBOOK_CREATOR_TRUSTED_PROXY_ALLOWED_SKEW_SECONDS:-60}
      GREENBOOK_CREATOR_TRUSTED_PROXY_NONCE_TTL_SECONDS: ${GREENBOOK_CREATOR_TRUSTED_PROXY_NONCE_TTL_SECONDS:-120}
    ports:
      - "${GREENBOOK_CREATOR_API_PORT:-8092}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/actuator/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    stop_grace_period: 30s
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256

  creator-worker:
    <<: *mindflow-service
    command: ["python", "-m", "app.creator.worker.cli", "run"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      creator-migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    environment:
      <<: *creator-runtime-env
      GREENBOOK_CREATOR_WORKER_ID: ${GREENBOOK_CREATOR_WORKER_ID:-creator-runtime}
      GREENBOOK_CREATOR_WORKER_CONCURRENCY: ${GREENBOOK_CREATOR_WORKER_CONCURRENCY:-4}
      GREENBOOK_CREATOR_WORKER_BATCH_SIZE: ${GREENBOOK_CREATOR_WORKER_BATCH_SIZE:-8}
      GREENBOOK_CREATOR_WORKER_POLL_SECONDS: ${GREENBOOK_CREATOR_WORKER_POLL_SECONDS:-0.5}
      GREENBOOK_CREATOR_WORKER_OUTBOX_LEASE_SECONDS: ${GREENBOOK_CREATOR_WORKER_OUTBOX_LEASE_SECONDS:-300}
      GREENBOOK_CREATOR_WORKER_HEARTBEAT_SECONDS: ${GREENBOOK_CREATOR_WORKER_HEARTBEAT_SECONDS:-30}
      GREENBOOK_CREATOR_WORKER_MAX_ATTEMPTS: ${GREENBOOK_CREATOR_WORKER_MAX_ATTEMPTS:-8}
      GREENBOOK_CREATOR_WORKER_RETRY_BASE_SECONDS: ${GREENBOOK_CREATOR_WORKER_RETRY_BASE_SECONDS:-2}
      GREENBOOK_CREATOR_WORKER_RETRY_MAX_SECONDS: ${GREENBOOK_CREATOR_WORKER_RETRY_MAX_SECONDS:-60}
      GREENBOOK_CREATOR_WORKER_SHUTDOWN_GRACE_SECONDS: ${GREENBOOK_CREATOR_WORKER_SHUTDOWN_GRACE_SECONDS:-30}
      GREENBOOK_CREATOR_WORKER_HEALTH_FILE: /tmp/creator-worker-heartbeat
      GREENBOOK_CREATOR_WORKER_HEALTH_MAX_AGE_SECONDS: ${GREENBOOK_CREATOR_WORKER_HEALTH_MAX_AGE_SECONDS:-90}
      GREENBOOK_CREATOR_WORKER_CREATE_SCHEMA: "false"
      GREENBOOK_CREATOR_CHECKPOINT_AUTO_SETUP: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.creator.worker.cli",
          "healthcheck",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 45s
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256

  creator-mcp:
    <<: *mindflow-service
    profiles: ["creator-mcp"]
    command: ["python", "-m", "app.mcp_tools.creator_server"]
    restart: unless-stopped
    depends_on:
      creator-migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    environment:
      <<: *creator-database-env
      GREENBOOK_CREATOR_RETRIEVAL_ENABLED: ${GREENBOOK_CREATOR_RETRIEVAL_ENABLED:-true}
      GREENBOOK_CREATOR_RETRIEVAL_SQL_ENABLED: ${GREENBOOK_CREATOR_RETRIEVAL_SQL_ENABLED:-true}
      GREENBOOK_CREATOR_RETRIEVAL_QDRANT_ENABLED: ${GREENBOOK_CREATOR_RETRIEVAL_QDRANT_ENABLED:-true}
      GREENBOOK_CREATOR_RETRIEVAL_QDRANT_URL: http://qdrant:6333
      GREENBOOK_CREATOR_MEMORY_EMBEDDING_PROVIDER: ${GREENBOOK_CREATOR_MEMORY_EMBEDDING_PROVIDER:-hashing}
      GREENBOOK_CREATOR_COMMUNITY_PROVIDER: java
      GREENBOOK_CREATOR_MCP_TRANSPORT: streamable-http
      GREENBOOK_CREATOR_MCP_HOST: 0.0.0.0
      GREENBOOK_CREATOR_MCP_PORT: 8010
      GREENBOOK_CREATOR_MCP_TENANT_ID: ${GREENBOOK_CREATOR_MCP_TENANT_ID:-tenant-local}
      GREENBOOK_CREATOR_MCP_CREATOR_ID: ${GREENBOOK_CREATOR_MCP_CREATOR_ID:-creator-local}
      GREENBOOK_CREATOR_MCP_ACTOR_ID: ${GREENBOOK_CREATOR_MCP_ACTOR_ID:-mindflow-mcp}
      GREENBOOK_CREATOR_MCP_ROLES: ${GREENBOOK_CREATOR_MCP_ROLES:-CREATOR}
      GREENBOOK_CREATOR_MCP_ALLOWED_TOOLS: ${GREENBOOK_CREATOR_MCP_ALLOWED_TOOLS:-}
      GREENBOOK_CREATOR_MCP_BEARER_TOKEN: ${GREENBOOK_CREATOR_MCP_BEARER_TOKEN:-}
      GREENBOOK_CREATOR_MCP_AUTH_ISSUER_URL: ${GREENBOOK_CREATOR_MCP_AUTH_ISSUER_URL:-http://127.0.0.1:18010}
      GREENBOOK_CREATOR_MCP_RESOURCE_SERVER_URL: ${GREENBOOK_CREATOR_MCP_RESOURCE_SERVER_URL:-http://127.0.0.1:18010}
      GREENBOOK_CREATOR_MCP_ALLOWED_HOSTS: ${GREENBOOK_CREATOR_MCP_ALLOWED_HOSTS:-127.0.0.1,127.0.0.1:*,localhost,localhost:*,creator-mcp,creator-mcp:*}
      GREENBOOK_CREATOR_MCP_ALLOWED_ORIGINS: ${GREENBOOK_CREATOR_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "18010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; connection = socket.create_connection(('127.0.0.1', 8010), 2); connection.close()",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6
    cpus: "0.5"
    mem_limit: 512m

  creator-eval:
    <<: *mindflow-service
    profiles: ["creator-eval"]
    command:
      [
        "python",
        "-m",
        "app.creator.evaluation.cli",
        "--persist",
        "--fail-on-threshold",
      ]
    depends_on:
      creator-migrate:
        condition: service_completed_successfully
    environment:
      <<: *creator-database-env
      GREENBOOK_CREATOR_EVALUATION_DATASET_PATH: app/creator/evaluation/datasets/smoke-v1.json
      GREENBOOK_CREATOR_EVALUATION_OBSERVATIONS_PATH: app/creator/evaluation/datasets/smoke-observations-v1.json
      GREENBOOK_CREATOR_EVALUATION_OUTPUT_PATH: target/creator-evaluation-report.json
      GREENBOOK_CREATOR_EVALUATION_CANDIDATE_NAME: ${GREENBOOK_CREATOR_EVALUATION_CANDIDATE_NAME:-mindflow-creator}
      GREENBOOK_CREATOR_EVALUATION_CANDIDATE_VERSION: ${GREENBOOK_CREATOR_EVALUATION_CANDIDATE_VERSION:-development}
      GREENBOOK_CREATOR_EVALUATION_JUDGE_PROVIDER: ${GREENBOOK_CREATOR_EVALUATION_JUDGE_PROVIDER:-deterministic}
      GREENBOOK_CREATOR_EVALUATION_JUDGE_BASE_URL: ${GREENBOOK_CREATOR_EVALUATION_JUDGE_BASE_URL:-}
      GREENBOOK_CREATOR_EVALUATION_JUDGE_API_KEY: ${GREENBOOK_CREATOR_EVALUATION_JUDGE_API_KEY:-}
      GREENBOOK_CREATOR_EVALUATION_JUDGE_MODEL: ${GREENBOOK_CREATOR_EVALUATION_JUDGE_MODEL:-}
    volumes:
      - ./target:/app/target
    healthcheck:
      disable: true
    restart: "no"
    cpus: "1.0"
    mem_limit: 1g

volumes:
  creator-postgres-data:
  redis-data:
  qdrant-data:
