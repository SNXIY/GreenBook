[project]
name = "greenbook-security"
version = "0.1.0"
description = "GreenBook auth context, JWT validation, and security utilities"
requires-python = ">=3.12"
dependencies = [
    "greenbook-contracts",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyjwt>=2.10",
]

[tool.hatch.build.targets.wheel]
packages = ["greenbook_security"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
