[project]
name = "greenbook-observability"
version = "0.1.0"
description = "GreenBook telemetry, logging, tracing utilities"
requires-python = ">=3.12"
dependencies = [
    "greenbook-contracts",
    "opentelemetry-api>=1.30",
]

[tool.hatch.build.targets.wheel]
packages = ["greenbook_observability"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
