[project]
name = "greenbook-agent-core"
version = "0.1.0"
description = "GreenBook Agent Runtime core — agent loop, context, memory, prompts"
requires-python = ">=3.12"
dependencies = [
    "greenbook-contracts",
    "greenbook-security",
    "pydantic>=2.10",
    "httpx>=0.28",
    "openai>=1.80",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["greenbook_agent_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
