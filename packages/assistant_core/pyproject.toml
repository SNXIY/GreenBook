[project]
name = "greenbook-assistant-core"
version = "0.1.0"
description = "GreenBook lightweight assistant — agent loop, context, memory, prompts"
requires-python = ">=3.12"
dependencies = [
    "greenbook-contracts",
    "greenbook-security",
    "pydantic>=2.10",
    "httpx>=0.28",
    "openai>=1.80",
]

[tool.hatch.build.targets.wheel]
packages = ["greenbook_assistant_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
