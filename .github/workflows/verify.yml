name: Verify monorepo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate local-only JWT test keys
        working-directory: .
        run: |
          mkdir -p apps/backend/src/main/resources/keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out apps/backend/src/main/resources/keys/private.pem
          openssl pkey -in apps/backend/src/main/resources/keys/private.pem -pubout -out apps/backend/src/main/resources/keys/public.pem
      - run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiguang-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zhiguang-fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  agent-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DEEPSEEK_API_KEY: test-only-not-used-for-network-calls
      GREENBOOK_AGENT_SERVICE_SHARED_SECRET: test-only-assistant-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check packages/agent_core apps/agent_api apps/agent_worker services/greenbook_mcp packages/contracts packages/security packages/java_client tests
      - run: uv run python -m pytest -q
