name: Verify monorepo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiguang-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate local-only JWT test keys
        working-directory: .
        run: |
          mkdir -p zhiguang-be/src/main/resources/keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out zhiguang-be/src/main/resources/keys/private.pem
          openssl pkey -in zhiguang-be/src/main/resources/keys/private.pem -pubout -out zhiguang-be/src/main/resources/keys/public.pem
      - run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiguang-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zhiguang-fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  creator-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-agent
    env:
      AI_PROVIDER: deepseek
      DEEPSEEK_API_KEY: test-only-not-used-for-network-calls
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  moderation-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moderation-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

  assistant-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-assistant-agent
    env:
      DEEPSEEK_API_KEY: test-only-not-used-for-network-calls
      MODERATION_AGENT_AUTH_SECRET: test-only-moderation-secret
      ASSISTANT_SERVICE_SHARED_SECRET: test-only-assistant-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
